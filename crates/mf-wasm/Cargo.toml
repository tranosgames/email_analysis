[package]
name = "mf-wasm"
description = "MailForensics : moteur compilé en WebAssembly pour la version web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mf-engine.workspace = true
mf-report.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"
mf-sig.workspace = true
mf-pst.workspace = true

# rPGP et RustCrypto exigent une source d'aléa à la compilation (jamais utilisée pour vérifier) :
# en WebAssembly, elle vient de crypto.getRandomValues du navigateur.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
pgp = { version = "0.21", default-features = false, features = ["wasm"] }
